<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #004d00; /* Vert foncé */
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 5px #000; /* Effet d'ombre pour le texte */
            margin-top: 50px;
        }

        img {
            display: block;
            margin: 30px auto;
            border: 5px solid #fff;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5); /* Effet de profondeur sur l'image */
        }

        .container {
            text-align: center;
        }

        .container h1 {
            padding: 20px;
            border: 2px solid #fff;
            background-color: rgba(255, 255, 255, 0.1); /* Fond transparent */
            display: inline-block;
        }

        /* Effet de survol sur l'image */
        img:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease-in-out;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Baise ton père sale soumise</h1>
        <img src="gobdance.gif" width="700" height="600" alt="Danse goblin">
    </div>
</body>
</html>
